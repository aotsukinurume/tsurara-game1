<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>つらら避け</title>

<!-- OGP設定 -->
<meta property="og:type" content="website">
<meta property="og:title" content="つらら避け｜何秒よけられる？">
<meta property="og:description" content="落ちてくるつららをひたすらよけるミニゲーム">
<meta property="og:url" content="https://aotsukinurume.github.io/tsurara-game1/">
<meta property="og:image" content="https://aotsukinurume.github.io/tsurara-game1/ogp.png">

<!-- Xカード設定 -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="つらら避け｜何秒よけられる？">
<meta name="twitter:description" content="落ちてくるつららをひたすらよけるミニゲーム">
<meta name="twitter:image" content="https://aotsukinurume.github.io/tsurara-game1/ogp.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="540"></canvas>
  <div id="ui">
    <h1 id="title">つらら避け</h1>
    <p id="msg">画面をなぞって左右に動く<br>（キーボードは ← →）</p>
    <p id="result"></p>
    <ol id="rank"></ol>
    <button id="start">はじめる</button>
    <a id="share" class="btn" target="_blank" rel="noopener" hidden>Xでシェア</a>
  </div>
</div>
<script>
// error画面を出す
window.onerror = function (m, src, line) {
  var e = document.getElementById('msg');
  if (e) e.textContent = 'エラー: ' + m + ' (' + String(src || '').split('/').pop() + ':' + line + ')';
};
</script>
<script src="game.js" onerror="document.getElementById('msg').textContent='game.js が見つかりません。index.html と同じフォルダに置いてね'"></script>
</body>
</html>
